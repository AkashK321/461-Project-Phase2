# .github/workflows/deploy.yml
name: Deploy to AWS

# Trigger the workflow on pushes to the 'main' branch
on:
  push:
    branches:
      - main
      - scorer-lambda
      - s3-storage
      - registry-endpoints
      - refactor-file-structure
      - download-model-from-hugging-face
      - model-lineage
      - authentication-and-registration
      - enhance-search-endpoints
      - uploads-and-downloads
      - 32-rate-models
      - frontend
      - rbac-auth
      - dataset-and-code-urls
      - search-for-artifact-by-name
      - refactor-metrics-to-use-hp-api-instead-of-github
      - create-and-delete-users
      - url-tests

# Define the permissions the job will need
permissions:
  id-token: write  # Required for OIDC authentication
  contents: read   # Required to check out the repository

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Paste the ARN of the IAM role you created in Step 1
          role-to-assume: arn:aws:iam::245639921953:role/GithubActions_DeployRole
          aws-region: us-east-2 # Change this to your AWS region

      # --- Example: Deploy Backend to AWS Lambda ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Lambda deployment package
        run: |
          mkdir package

          # 1. Install Python dependencies
          pip install -r requirements.txt -t ./package

          # 2. Copy source code
          cp -r src/* ./package/

          # 3. DOWNLOAD AND BUNDLE GIT (The Fix)
          # We use a public layer artifact compatible with Amazon Linux
          curl -L https://github.com/lambci/git-lambda-layer/releases/download/v2.25.1/git-2.25.1-lambda-layer.zip -o git-layer.zip
          unzip git-layer.zip -d package/

          # 4. Create the final Zip
          cd package
          zip -r ../lambda_deployment.zip .

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name "scorer_function" \
            --zip-file fileb://lambda_deployment.zip

          aws lambda update-function-code \
            --function-name "registry_api" \
            --zip-file fileb://lambda_deployment.zip

          echo "Waiting for registry_api function update to complete..."
          aws lambda wait function-updated --function-name "registry_api"

      - name: Sync Frontend to S3
        run: |
          aws s3 sync ./frontend s3://ece461team11-frontend --delete