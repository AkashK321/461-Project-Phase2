# .github/workflows/deploy.yml
name: Deploy to AWS

# Trigger the workflow on pushes to the 'main' branch
on:
  push:
    branches:
      - main

# Define the permissions the job will need
permissions:
  id-token: write  # Required for OIDC authentication
  contents: read   # Required to check out the repository

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Paste the ARN of the IAM role you created in Step 1
          role-to-assume: arn:aws:iam::245639921953:role/GithubActions_DeployRole
          aws-region: us-east-2 # Change this to your AWS region

      # --- Example: Deploy Backend to AWS Lambda ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 
      
      - name: Create Lambda deployment package
        run: |
          # Create a directory to hold the package contents
          mkdir package
          
          # Install dependencies from requirements.txt into the package directory
          pip install -r requirements.txt -t ./package
          
          # Copy the application source code into the package directory
          # This makes 'scorer' and 'aws' top-level packages in the zip
          cp -r src/* ./package/
          
          # Create the zip file from the contents of the package directory
          cd package
          zip -r ../lambda_deployment.zip .
          
      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name scorer-function \
            --zip-file fileb://lambda_deployment.zip
        env:
          # Ensure you have AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as secrets
          AWS_REGION: us-east-2 # Change to your region