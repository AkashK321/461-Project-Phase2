<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Registry</title>
    <style>
        :root {
            --primary-color: #004494;
            --primary-hover: #003377;
            --secondary-color: #5a6268;
            --text-color: #212529;
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --danger-color: #dc3545;
            --danger-hover: #c82333;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 1rem; }
        .hidden { display: none !important; }
        
        /* Navbar */
        .nav-header { display: flex; gap: 10px; margin-bottom: 2rem; background: #ddd; padding: 10px; border-radius: 8px; }
        .nav-btn { padding: 8px 16px; cursor: pointer; border: none; background: #fff; border-radius: 4px; font-weight: bold; }
        .nav-btn:hover { background: #eee; }
        .nav-btn.danger { color: white; background: var(--danger-color); }
        .nav-btn.danger:hover { background: var(--danger-hover); }

        /* Sections */
        .section { background: var(--card-bg); padding: 1.5rem; margin-bottom: 1rem; border-radius: 8px; border: 1px solid #ccc; }
        input, button { display: block; width: 100%; margin-bottom: 1rem; padding: 10px; box-sizing: border-box; }
        button { background: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: var(--primary-hover); }
        
        /* Modals */
        dialog { border: none; border-radius: 8px; padding: 2rem; width: 500px; max-width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        dialog::backdrop { background: rgba(0,0,0,0.5); }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; }
        
        /* Form Checks */
        .checkbox-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .checkbox-group label { display: flex; align-items: center; gap: 5px; font-weight: normal; }
        .checkbox-group input { width: auto; margin: 0; }
    </style>
</head>
<body>
    <main>
        <h1>Package Registry</h1>

        <div id="nav-bar" class="nav-header hidden">
            <button class="nav-btn" onclick="handleLogout()">Log Out</button>
            
            <button class="nav-btn admin-only hidden" onclick="resetRegistry()">Reset Registry</button>
            <button class="nav-btn admin-only hidden" onclick="openCreateUserModal()">Create User</button>
            <button class="nav-btn admin-only hidden" onclick="openViewUsersModal()">View Users</button>
            
            <button class="nav-btn danger user-only hidden" onclick="deleteSelf()">Delete Account</button>
        </div>

        <section id="login-section" class="section">
            <h2>Login</h2>
            <div id="login-error" style="color:red; margin-bottom:1rem;" class="hidden"></div>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
        </section>

        <div id="dashboard" class="hidden">
            <section class="section">
                <h3>Upload Package</h3>
                <input type="url" id="pkg-url" placeholder="https://github.com/user/repo">
                <button onclick="uploadPackage()">Upload</button>
                <div id="upload-res"></div>
            </section>
            
            <section class="section">
                <h3>Search Packages</h3>
                <input type="text" id="search-q" placeholder="Search (Regex allowed)" value=".*">
                <button onclick="searchPackages()">Search</button>
                <div id="search-res"></div>
            </section>
        </div>
    </main>

    <dialog id="create-user-modal">
        <h3>Create New User</h3>
        <input type="text" id="new-user-name" placeholder="Username">
        <input type="password" id="new-user-pass" placeholder="Password">
        <div class="checkbox-group">
            <label><input type="checkbox" id="role-admin" onchange="toggleAdminRoles(this)"> Admin</label>
            <label><input type="checkbox" class="role-chk" value="upload"> Upload</label>
            <label><input type="checkbox" class="role-chk" value="search"> Search</label>
            <label><input type="checkbox" class="role-chk" value="download"> Download</label>
        </div>
        <button id="create-btn" onclick="createUser()">Create User</button>
        <button onclick="document.getElementById('create-user-modal').close()" style="background:#666">Cancel</button>
    </dialog>

    <dialog id="view-users-modal" style="width: 700px;">
        <h3>All Users</h3>
        <div id="users-list-container">Loading...</div>
        <button onclick="document.getElementById('view-users-modal').close()" style="margin-top:1rem; background:#666">Close</button>
    </dialog>

    <dialog id="modify-roles-modal">
        <h3>Modify Roles</h3>
        <p id="mod-user-display"></p>
        <input type="hidden" id="mod-user-id">
        <div class="checkbox-group">
            <label><input type="checkbox" id="mod-role-admin"> Admin</label>
            <label><input type="checkbox" class="mod-chk" value="upload"> Upload</label>
            <label><input type="checkbox" class="mod-chk" value="search"> Search</label>
            <label><input type="checkbox" class="mod-chk" value="download"> Download</label>
        </div>
        <button onclick="submitRoleUpdate()">Save Changes</button>
        <button onclick="document.getElementById('modify-roles-modal').close()" style="background:#666">Cancel</button>
    </dialog>

    <script>
        const API_URL = "https://bbdudjvh08.execute-api.us-east-2.amazonaws.com"; 
        let authToken = null;
        let currentUser = null;

        // --- Auth & JWT ---
        function parseJwt (token) {
            try {
                var base64Url = token.split('.')[1];
                var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        async function handleLogin() {
            const name = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errDiv = document.getElementById('login-error');
            
            try {
                const res = await fetch(`${API_URL}/authenticate`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user: { name: name }, secret: { password: pass } })
                });

                if(res.ok) {
                    const txt = await res.json();
                    authToken = txt.replace(/"/g, '').split(' ')[1]; // Extract token from "bearer <token>"
                    
                    const decoded = parseJwt(authToken);
                    if(decoded) {
                        currentUser = decoded;
                        updateUI(true);
                    } else {
                        errDiv.innerText = "Failed to parse token.";
                        errDiv.classList.remove('hidden');
                    }
                } else {
                    errDiv.innerText = "Invalid Credentials";
                    errDiv.classList.remove('hidden');
                }
            } catch(e) {
                errDiv.innerText = "Connection Error: " + e.message;
                errDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            authToken = null;
            currentUser = null;
            updateUI(false);
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function updateUI(isLoggedIn) {
            const nav = document.getElementById('nav-bar');
            const login = document.getElementById('login-section');
            const dash = document.getElementById('dashboard');
            
            if(isLoggedIn) {
                nav.classList.remove('hidden');
                login.classList.add('hidden');
                dash.classList.remove('hidden');

                const isAdmin = currentUser.roles && currentUser.roles.includes('admin');
                
                // Show Admin Buttons
                document.querySelectorAll('.admin-only').forEach(el => {
                    if(isAdmin) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                });

                // Show Regular User Delete Button (if not admin, or admins can delete themselves via View Users)
                document.querySelectorAll('.user-only').forEach(el => {
                    if(!isAdmin) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                });

            } else {
                nav.classList.add('hidden');
                login.classList.remove('hidden');
                dash.classList.add('hidden');
            }
        }

        // --- Admin Features ---

        function openCreateUserModal() {
            // Reset form
            document.getElementById('new-user-name').value = '';
            document.getElementById('new-user-pass').value = '';
            document.getElementById('role-admin').checked = false;
            document.querySelectorAll('.role-chk').forEach(c => {
                c.checked = false; 
                c.disabled = false;
            });
            document.getElementById('create-user-modal').showModal();
        }

        function toggleAdminRoles(adminCheckbox) {
            const others = document.querySelectorAll('.role-chk');
            others.forEach(chk => {
                if(adminCheckbox.checked) {
                    chk.checked = true;
                    chk.disabled = true;
                } else {
                    chk.disabled = false;
                    chk.checked = false;
                }
            });
        }

        async function createUser() {
            const name = document.getElementById('new-user-name').value;
            const pass = document.getElementById('new-user-pass').value;
            const isAdmin = document.getElementById('role-admin').checked;
            
            // Collect roles
            let roles = [];
            if(isAdmin) {
                roles = ['admin', 'upload', 'search', 'download'];
            } else {
                document.querySelectorAll('.role-chk').forEach(c => {
                    if(c.checked) roles.push(c.value);
                });
            }

            // Validation
            if(!name || !pass || roles.length === 0) {
                alert("Username, password, and at least one role are required.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Authorization': `bearer ${authToken}` },
                    body: JSON.stringify({ username: name, password: pass, roles: roles })
                });
                if(res.ok) {
                    alert("User Created!");
                    document.getElementById('create-user-modal').close();
                } else {
                    const json = await res.json();
                    alert("Error: " + (json.error || "Unknown"));
                }
            } catch(e) { alert("Error: " + e.message); }
        }

        async function openViewUsersModal() {
            document.getElementById('view-users-modal').showModal();
            const list = document.getElementById('users-list-container');
            list.innerHTML = "Loading...";

            try {
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'X-Authorization': `bearer ${authToken}` }
                });
                const users = await res.json();
                
                if(!res.ok) throw new Error(users.error);

                let html = `<table><tr><th>Username</th><th>ID</th><th>Roles</th><th>Actions</th></tr>`;
                users.forEach(u => {
                    html += `<tr>
                        <td>${u.username}</td>
                        <td style="font-family:monospace; font-size:0.8em">${u.id}</td>
                        <td>${u.roles.join(', ')}</td>
                        <td>
                            <button onclick="openModifyRoles('${u.id}', '${u.username}', '${u.roles.join(',')}')" style="font-size:0.8em; padding:5px; width:auto; display:inline;">Edit</button>
                            <button onclick="deleteUser('${u.id}')" style="font-size:0.8em; padding:5px; width:auto; display:inline; background:var(--danger-color);">Delete</button>
                        </td>
                    </tr>`;
                });
                html += "</table>";
                list.innerHTML = html;
            } catch(e) {
                list.innerHTML = "Error loading users: " + e.message;
            }
        }

        // --- Modify Roles ---
        function openModifyRoles(id, name, rolesStr) {
            document.getElementById('mod-user-id').value = id;
            document.getElementById('mod-user-display').innerText = "Editing: " + name;
            
            const roles = rolesStr.split(',');
            const isAdmin = roles.includes('admin');

            document.getElementById('mod-role-admin').checked = isAdmin;
            document.querySelectorAll('.mod-chk').forEach(c => {
                c.checked = roles.includes(c.value) || isAdmin;
            });
            document.getElementById('modify-roles-modal').showModal();
        }

        async function submitRoleUpdate() {
            const id = document.getElementById('mod-user-id').value;
            const isAdmin = document.getElementById('mod-role-admin').checked;
            let roles = [];
            
            if(isAdmin) {
                roles = ['admin', 'upload', 'search', 'download'];
            } else {
                document.querySelectorAll('.mod-chk').forEach(c => {
                    if(c.checked) roles.push(c.value);
                });
            }

            try {
                const res = await fetch(`${API_URL}/users/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Authorization': `bearer ${authToken}` },
                    body: JSON.stringify({ roles: roles })
                });
                if(res.ok) {
                    alert("Roles Updated");
                    document.getElementById('modify-roles-modal').close();
                    openViewUsersModal(); // Reload list
                } else {
                    const json = await res.json();
                    alert("Error: " + json.error);
                }
            } catch(e) { alert("Error: " + e.message); }
        }

        // --- Delete Logic ---
        async function deleteUser(id) {
            if(!confirm("Are you sure you want to delete this user?")) return;
            try {
                const res = await fetch(`${API_URL}/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'X-Authorization': `bearer ${authToken}` }
                });
                if(res.ok) {
                    // Reload list if modal is open
                    const modal = document.getElementById('view-users-modal');
                    if(modal.open) openViewUsersModal();
                } else {
                    const json = await res.json();
                    alert("Error: " + json.error);
                }
            } catch(e) { alert("Error: " + e.message); }
        }

        async function deleteSelf() {
            if(!confirm("Are you sure you want to delete your account? This cannot be undone.")) return;
            try {
                const res = await fetch(`${API_URL}/users/${currentUser.sub}`, {
                    method: 'DELETE',
                    headers: { 'X-Authorization': `bearer ${authToken}` }
                });
                if(res.ok) {
                    alert("Account deleted.");
                    handleLogout();
                } else {
                    const json = await res.json();
                    alert("Error: " + json.error);
                }
            } catch(e) { alert("Error: " + e.message); }
        }

        // --- Upload/Search ---
        async function uploadPackage() {
            const url = document.getElementById('pkg-url').value;
            const resDiv = document.getElementById('upload-res');
            resDiv.innerText = "Uploading...";
            try {
                const res = await fetch(`${API_URL}/artifact/model`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-Authorization': `bearer ${authToken}`},
                    body: JSON.stringify({ url: url })
                });
                const json = await res.json();
                resDiv.innerHTML = `<pre>${JSON.stringify(json, null, 2)}</pre>`;
            } catch(e) { resDiv.innerText = "Error: " + e.message; }
        }

        async function searchPackages() {
            const q = document.getElementById('search-q').value;
            const resDiv = document.getElementById('search-res');
            resDiv.innerText = "Searching...";
            try {
                const res = await fetch(`${API_URL}/artifacts`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-Authorization': `bearer ${authToken}`},
                    body: JSON.stringify([{ name: q }])
                });
                const json = await res.json();
                resDiv.innerHTML = `<pre>${JSON.stringify(json, null, 2)}</pre>`;
            } catch(e) { resDiv.innerText = "Error: " + e.message; }
        }

        async function resetRegistry() {
            if(!confirm("WARNING: Wipe entire registry?")) return;
            try {
                const res = await fetch(`${API_URL}/reset`, {
                    method: 'DELETE',
                    headers: {'X-Authorization': `bearer ${authToken}`}
                });
                const json = await res.json();
                alert(JSON.stringify(json));
            } catch(e) { alert("Error: " + e.message); }
        }
    </script>
</body>
</html>
