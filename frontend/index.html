<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Registry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Package Registry</h1>

        <nav id="nav-bar" class="nav-header hidden" aria-label="Main Navigation">
            <button class="nav-btn" onclick="handleLogout()">Log Out</button>
            
            <button class="nav-btn admin-only hidden" onclick="window.location.hash='#/admin/reset'">Reset Registry</button>
            <button class="nav-btn admin-only hidden" onclick="window.location.hash='#/admin/create-user'">Create User</button>
            <button class="nav-btn admin-only hidden" onclick="window.location.hash='#/admin/view-users'">View Users</button>
            
            <button class="nav-btn danger user-only hidden" onclick="deleteSelf()">Delete Account</button>
        </nav>

        <section id="login-section" class="section" aria-labelledby="login-title">
            <h2 id="login-title">Login</h2>
            
            <div id="login-error" class="error-box hidden" role="alert"></div>

            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
            
            <button onclick="handleLogin()">Login</button>
        </section>

        <div id="dashboard" class="hidden">
            <section class="section" aria-labelledby="upload-title">
                <h3 id="upload-title">Upload Package</h3>
                <label for="pkg-url">Package URL (GitHub or HuggingFace)</label>
                <input type="url" id="pkg-url" placeholder="https://github.com/user/repo">
                <button onclick="uploadPackage()">Upload</button>
                <div id="upload-res" aria-live="polite" style="margin-top: 1rem;"></div>
            </section>
            
            <section class="section" aria-labelledby="search-title">
                <h3 id="search-title">Search Packages</h3>
                <label for="search-q">Search Query (Regex allowed)</label>
                <input type="text" id="search-q" value="*">
                <button onclick="searchPackages()">Search</button>
                <div id="search-res" class="table-container" aria-live="polite" style="margin-top: 1rem;"></div>
            </section>
        </div>
    </main>

    <dialog id="create-user-modal" aria-labelledby="create-user-title">
        <h3 id="create-user-title">Create New User</h3>
        
        <label for="new-user-name">New Username</label>
        <input type="text" id="new-user-name" required>
        
        <label for="new-user-pass">New Password</label>
        <input type="password" id="new-user-pass" required>
        
        <fieldset style="border: none; padding: 0; margin-bottom: 1.5rem;">
            <legend style="font-weight: 600; margin-bottom: 0.5rem;">Roles</legend>
            <div class="checkbox-group">
                <label><input type="checkbox" id="role-admin" onchange="toggleAdminRoles(this)"> Admin</label>
                <label><input type="checkbox" class="role-chk" value="upload"> Upload</label>
                <label><input type="checkbox" class="role-chk" value="search"> Search</label>
                <label><input type="checkbox" class="role-chk" value="download"> Download</label>
            </div>
        </fieldset>

        <button id="create-btn" onclick="createUser()">Create User</button>
        <button onclick="window.location.hash='#/dashboard'" style="background:#6c757d; margin-top: 10px;">Cancel</button>
    </dialog>

    <dialog id="view-users-modal" style="width: 800px;" aria-labelledby="view-users-title">
        <h3 id="view-users-title">All Users</h3>
        <div id="users-list-container" class="table-container" aria-live="polite">Loading...</div>
        <button onclick="window.location.hash='#/dashboard'" style="margin-top:1rem; background:#6c757d">Close</button>
    </dialog>

    <dialog id="modify-roles-modal" aria-labelledby="mod-roles-title">
        <h3 id="mod-roles-title">Modify Roles</h3>
        <p id="mod-user-display" style="margin-bottom: 1.5rem; font-weight: bold;"></p>
        <input type="hidden" id="mod-user-id">
        
        <fieldset style="border: none; padding: 0; margin-bottom: 1.5rem;">
            <legend style="font-weight: 600; margin-bottom: 0.5rem;">Select Roles</legend>
            <div class="checkbox-group">
                <label><input type="checkbox" id="mod-role-admin"> Admin</label>
                <label><input type="checkbox" class="mod-chk" value="upload"> Upload</label>
                <label><input type="checkbox" class="mod-chk" value="search"> Search</label>
                <label><input type="checkbox" class="mod-chk" value="download"> Download</label>
            </div>
        </fieldset>

        <button onclick="submitRoleUpdate()">Save Changes</button>
        <button onclick="document.getElementById('modify-roles-modal').close()" style="background:#6c757d; margin-top: 10px;">Cancel</button>
    </dialog>

    <script src="app.js" defer></script>
</body>
</html>
