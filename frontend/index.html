<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Registry</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --primary-hover: #004494;
            --danger-color: #c82333;
            --danger-hover: #bd2130;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
            --radius: 12px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }

        h1, h2, h3 {
            margin-top: 0;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Card Styling */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            margin-bottom: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* Form Elements */
        label {
            display: block;
            margin-top: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.25rem;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px; 
            font-size: 1rem;
        }

        input:focus, button:focus {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
            border-color: var(--primary-color);
        }

        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px; 
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.delete {
            background-color: var(--danger-color);
        }

        button.delete:hover {
            background-color: var(--danger-hover);
        }

      
        .output-container {
            background: #2d2d2d;
            color: #fff;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }

        pre {
            margin: 0;
            white-space: pre-wrap; 
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <main>
        <h1>Package Registry UI</h1>

        <section id="login-section" class="card" aria-labelledby="login-heading">
            <h2 id="login-heading">Login</h2>
            
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" autocomplete="username">
            
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
            
            <button onclick="handleLogin()">Login</button>
        </section>

        <div id="dashboard" class="hidden">
            <section class="card">
                <p><strong>Status:</strong> <span id="token-display">Authentication active</span></p>
            </section>

            <section class="card" aria-labelledby="upload-heading">
                <h3 id="upload-heading">Upload Package</h3>
                <label for="package-url">Package URL (GitHub/npm)</label>
                <input type="url" id="package-url" placeholder="https://github.com/user/repo">
                <button onclick="uploadPackage()">Upload</button>
            </section>

            <section class="card" aria-labelledby="search-heading">
                <h3 id="search-heading">Search Packages</h3>
                <label for="search-query">Query (Regex)</label>
                <input type="text" id="search-query" value="*">
                <button onclick="searchPackages()">Search</button>
            </section>

            <section class="card" aria-labelledby="admin-heading">
                <h3 id="admin-heading">Admin Actions</h3>
                <button class="delete" onclick="resetRegistry()">Reset Registry</button>
            </section>

            <section class="card" aria-labelledby="output-heading">
                <h3 id="output-heading">System Output</h3>
                <div class="output-container" aria-live="polite" id="output-region">
                    <pre id="output">Waiting for action...</pre>
                </div>
            </section>
        </div>
    </main>

    <script>
        const API_URL = "https://bbdudjvh08.execute-api.us-east-2.amazonaws.com"; 
        
        let authToken = null;

        function log(data) {
            const output = document.getElementById('output');
            output.textContent = JSON.stringify(data, null, 2);
        }

        async function handleLogin() {
            const name = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const payload = {
                user: { name: name, is_admin: true },
                secret: { password: password }
            };

            try {
                const res = await fetch(`${API_URL}/authenticate`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                
                if (res.ok) {
                    authToken = data.replace(/"/g, '').split(' ')[1]; 
                    
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    // Focus on the first input of dashboard for accessibility
                    document.getElementById('package-url').focus();
                    log("Login Successful");
                } else {
                    log(data);
                }
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function uploadPackage() {
            const url = document.getElementById('package-url').value;
            
            try {
                const res = await fetch(`${API_URL}/artifact/model`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    },
                    body: JSON.stringify({ url: url }) 
                });
                const data = await res.json();
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function searchPackages() {
            const queryName = document.getElementById('search-query').value;

            try {
                const res = await fetch(`${API_URL}/artifacts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    },
                    body: JSON.stringify([{ name: queryName }]) 
                });
                const data = await res.json();
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function resetRegistry() {
            if(!confirm("Are you sure? This will wipe the database.")) return;

            try {
                const res = await fetch(`${API_URL}/reset`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    }
                });
                const data = await res.json();
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }
    </script>
</body>
</html>
