<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Registry</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .section { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; border-radius: 5px; }
        label { display: block; margin-top: 0.5rem; }
        input, button { margin-top: 0.5rem; padding: 0.5rem; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        button.delete { background-color: #dc3545; }
        button.delete:hover { background-color: #a71d2a; }
        pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Package Registry UI</h1>

    <div id="login-section" class="section">
        <h2>Login</h2>
        <label>Username: <input type="text" id="username" placeholder="Enter username"></label>
        <label>Password: <input type="password" id="password" placeholder="Enter password"></label>
        <button onclick="handleLogin()">Login</button>
    </div>

    <div id="dashboard" class="section hidden">
        <p>Welcome! Token: <span id="token-display">...</span></p>
        
        <div class="section">
            <h3>Upload Package</h3>
            <label>Package URL (GitHub/npm): <input type="text" id="package-url" placeholder="https://github.com/user/repo"></label>
            <button onclick="uploadPackage()">Upload</button>
        </div>

        <div class="section">
            <h3>Search Packages</h3>
            <label>Query (Regex): <input type="text" id="search-query" value="*"></label>
            <button onclick="searchPackages(true)">Search</button>
            <button id="next-page-button" class="hidden" onclick="searchPackages(false)">Next Page</button>
        </div>

        <div class="section">
            <h3>Admin</h3>
            <button class="delete" onclick="resetRegistry()">Reset Registry</button>
        </div>

        <div class="section">
            <h3>Output</h3>
            <pre id="output">Waiting for action...</pre>
        </div>
    </div>

    <script>
        const API_URL = "https://bbdudjvh08.execute-api.us-east-2.amazonaws.com"; 
        
        let authToken = null;
        // pagination state for search results
        let nextSearchOffset = null;

        function log(data) {
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        }

        async function handleLogin() {
            const name = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Match structure expected by registry_api.py and auth.py
            const payload = {
                user: { name: name, is_admin: true },
                secret: { password: password }
            };

            try {
                const res = await fetch(`${API_URL}/authenticate`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                
                if (res.ok) {
                    // Your API returns specific string format: "bearer <token>"
                    // We need to clean it up to use in headers
                    authToken = data.replace(/"/g, '').split(' ')[1]; 
                    
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    document.getElementById('token-display').textContent = "Active";
                    log("Login Successful");
                } else {
                    log(data);
                }
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function uploadPackage() {
            const url = document.getElementById('package-url').value;
            
            try {
                const res = await fetch(`${API_URL}/artifact/model`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    },
                    body: JSON.stringify({ url: url }) // Matches ingest_artifact payload
                });
                const data = await res.json();
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function searchPackages(isFirstPage) {
            const queryName = document.getElementById('search-query').value;
            const nextPageButton = document.getElementById('next-page-button');

            if (isFirstPage) {
                nextSearchOffset = null; // Reset pagination
            }

            try {
                const url = new URL(`${API_URL}/artifacts`);
                if (nextSearchOffset) {
                    url.searchParams.append('offset', nextSearchOffset);
                }
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    },
                    body: JSON.stringify([{ name: queryName }]) // Matches search_artifacts payload
                });
                const data = await res.json();
                const offsetHeader = res.headers.get('Offset') || res.headers.get('offset');
                console.log("OffserHeader is " + offsetHeader);

                if (offsetHeader) {
                    nextSearchOffset = offsetHeader;
                    nextPageButton.classList.remove('hidden');
                } else {
                    nextSearchOffset = null;
                    nextPageButton.classList.add('hidden');
                }
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function resetRegistry() {
            if(!confirm("Are you sure? This will wipe the database.")) return;

            try {
                const res = await fetch(`${API_URL}/reset`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    }
                });
                const data = await res.json();
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }
    </script>
</body>
</html>
