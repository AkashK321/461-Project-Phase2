<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Registry</title>
    <style>
        :root {
            --primary-color: #004494;
            --primary-hover: #003377;
            --danger-color: #a71d2a;
            --danger-hover: #8c1823;
            --text-color: #212529;
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --input-border: #595959;
            --focus-ring: #0056b3;
            --radius: 0.75rem;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            line-height: 1.6; 
            font-size: 100%;
            overflow-wrap: break-word; 
            word-wrap: break-word;
        }

        .skip-link {
            position: absolute;
            top: -3rem;
            left: 0;
            background: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            z-index: 100;
            text-decoration: none;
            border-radius: 0 0 0.5rem 0;
        }
        .skip-link:focus {
            top: 0;
        }

        main {
            width: 100%;
            max-width: 50rem; 
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem; 
            color: #111;
            line-height: 1.3; 
        }

        h2, h3 {
            color: #333;
            margin-top: 0;
            line-height: 1.4;
        }

        p {
            margin-bottom: 1.5rem; 
        }

        /* Card/Section Styling */
        .section {
            background: var(--card-bg);
            border: 0.125rem solid var(--input-border); 
            padding: 1.5rem;
            margin-bottom: 2rem; 
            border-radius: var(--radius);
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.05);
            height: auto; 
            min-height: 0; 
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        /* Inputs and Buttons must expand vertically */
        input {
            width: 100%;
            padding: 0.8rem;
            border: 0.125rem solid var(--input-border);
            border-radius: 0.5rem;
            font-size: 1rem; 
            background-color: #fff;
            color: var(--text-color);
            min-height: 3rem; 
            line-height: 1.5;
        }

        button {
            display: inline-block;
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            height: auto;
            min-height: 3rem;
            white-space: normal; 
            line-height: 1.5;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.delete {
            background-color: var(--danger-color);
        }

        button.delete:hover {
            background-color: var(--danger-hover);
        }

        input:focus, button:focus {
            outline: 0.25rem solid var(--focus-ring);
            outline-offset: 0.125rem;
            border-color: transparent;
        }

        /* Output Area */
        .output-container {
            background: #2d2d2d;
            color: #fff;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto; 
            border: 0.0625rem solid #000;
        }

        pre {
            margin: 0;
            white-space: pre-wrap; 
            word-break: break-all; 
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 40rem) {
            .section { padding: 1rem; }
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <main id="main-content">
        <h1>Package Registry UI</h1>

        <section id="login-section" class="section" aria-labelledby="login-heading">
            <h2 id="login-heading">Login</h2>
            
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
            
            <button onclick="handleLogin()">Login</button>
        </section>

        <div id="dashboard" class="hidden">
            <section class="section" aria-labelledby="status-heading">
                <h2 id="status-heading" class="visually-hidden">Authentication Status</h2>
                <p role="status"><strong>Status:</strong> <span id="token-display">Authentication active</span></p>
            </section>

            <section class="section" aria-labelledby="upload-heading">
                <h3 id="upload-heading">Upload Package</h3>
                <label for="package-url">Package URL (GitHub/npm)</label>
                <input type="url" id="package-url" placeholder="https://github.com/user/repo" autocomplete="url">
                <button onclick="uploadPackage()">Upload</button>
            </section>

            <section class="section" aria-labelledby="search-heading">
                <h3 id="search-heading">Search Packages</h3>
                <label for="search-query">Query (Regex)</label>
                <input type="text" id="search-query" value="*" autocomplete="off">
                <button onclick="searchPackages()">Search</button>
            </section>

            <section class="section" aria-labelledby="admin-heading">
                <h3 id="admin-heading">Admin Actions</h3>
                <button class="delete" onclick="resetRegistry()">Reset Registry</button>
            </section>

            <section class="section" aria-labelledby="output-heading">
                <h3 id="output-heading">System Output</h3>
                <div class="output-container" aria-live="polite" id="output-region">
                    <pre id="output">Waiting for action...</pre>
                </div>
            </section>
        </div>
    </main>

    <script>
        const API_URL = "https://bbdudjvh08.execute-api.us-east-2.amazonaws.com"; 
        
        let authToken = null;

        function log(data) {
            const output = document.getElementById('output');
            output.textContent = JSON.stringify(data, null, 2);
        }

        async function handleLogin() {
            const name = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if(!name || !password) {
                log({ error: "Username and password are required." });
                return;
            }

            const payload = {
                user: { name: name, is_admin: true },
                secret: { password: password }
            };

            try {
                const res = await fetch(`${API_URL}/authenticate`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                
                if (res.ok) {
                    authToken = data.replace(/"/g, '').split(' ')[1]; 
                    
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    
                    const firstInput = document.getElementById('package-url');
                    if(firstInput) firstInput.focus();

                    log("Login Successful");
                } else {
                    log(data);
                }
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function uploadPackage() {
            const url = document.getElementById('package-url').value;
            if(!url) {
                log({ error: "URL is required." });
                return;
            }
            
            try {
                const res = await fetch(`${API_URL}/artifact/model`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    },
                    body: JSON.stringify({ url: url })
                });
                const data = await res.json();
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function searchPackages() {
            const queryName = document.getElementById('search-query').value;

            try {
                const res = await fetch(`${API_URL}/artifacts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    },
                    body: JSON.stringify([{ name: queryName }])
                });
                const data = await res.json();
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }

        async function resetRegistry() {
            if(!confirm("Are you sure? This will wipe the database.")) return;

            try {
                const res = await fetch(`${API_URL}/reset`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Authorization': `bearer ${authToken}`
                    }
                });
                const data = await res.json();
                log(data);
            } catch (err) {
                log({ error: err.message });
            }
        }
    </script>
</body>
</html>
